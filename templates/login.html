{% extends "base.html" %}
{% block title %}Log In – Lost Ball Dad{% endblock %}
{% block content %}
<div class="auth-section">
  <div class="auth-card">
    <h1>Log In</h1>
    {% if error %}<p class="auth-error">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="next" value="{{ next }}">
      <label>Email
        <input type="email" name="email" value="{{ email or '' }}" required>
      </label>
      <label>Password
        <input type="password" name="password" required>
      </label>
      <button type="submit" class="btn">Log In</button>
    </form>
    <a class="btn btn-google" href="/auth/google?next={{ next }}">Continue with Google</a>
    <p class="auth-alt">No account? <a href="/register">Register</a></p>
  </div>
</div>
{% endblock %}
