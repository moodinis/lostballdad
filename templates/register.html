{% extends "base.html" %}
{% block title %}Register – Lost Ball Dad{% endblock %}
{% block content %}
<div class="auth-section">
  <div class="auth-card">
    <h1>Create an Account</h1>
    {% if error %}<p class="auth-error">{{ error }}</p>{% endif %}
    <form method="post" action="/register">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="next" value="{{ next }}">
      <label>Name
        <input type="text" name="name" value="{{ name or '' }}" required>
      </label>
      <label>Username
        <input type="text" name="username" value="{{ username or '' }}" minlength="3" maxlength="20" pattern="[a-zA-Z0-9_]+" required>
      </label>
      <label>Email
        <input type="email" name="email" value="{{ email or '' }}" required>
      </label>
      <label>Password
        <input type="password" name="password" minlength="8" required>
      </label>
      <button type="submit" class="btn">Register</button>
    </form>
    <a class="btn btn-google" href="/auth/google?next={{ next }}">Continue with Google</a>
    <p class="auth-alt">Already have an account? <a href="/login">Log In</a></p>
  </div>
</div>
{% endblock %}
